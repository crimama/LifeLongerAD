# PGPT (Prototype-Guided Prompt Tuning) Configuration Example
# This configuration enables PGPT for continual learning

CONTINUAL:
  continual: true
  online: false
  use_knowledge_distillation: true
  use_neighbor_mask: true
  neighbor_radius: 1
  previous_task_grad_decay: 0.05
  
  # PGPT Configuration
  use_pgpt: true                    # Enable PGPT functionality
  prompt_dim: 256                   # Dimension of prompt vectors
  num_prompts_per_class: 1          # Number of prompts per class
  k_neighbors: 1                    # Number of neighbors for K-NN selection
  
  method:
    name: "spacenet"
    params:
      default_sparsity: 0.8
      layer_specific:
        layers.0.linear1: 0.7
        reconstruction.rec_head: 0.5

TRAIN:
  epochs: 100
  log_interval: 10
  eval_interval: 10
  wandb:
    use: true
    project: "PGPT_Continual_Learning"
    name: "pgpt_experiment"

OPTIMIZER:
  opt_name: "AdamW"
  lr: 0.001
  params:
    weight_decay: 0.01

SCHEDULER:
  name: "CosineAnnealingWarmupRestarts"
  params:
    first_cycle_steps: 100
    cycle_mult: 1.0
    max_lr: 0.001
    min_lr: 0.00001
    warmup_steps: 10
    gamma: 0.5

MODEL:
  method: "CFGCAD"
  backbone: "resnet18"
  params:
    feature_size: [16, 16]
    feature_dim: 256
    inplanes: 512
    cfg_embed_dim: 256
    feature_jitter:
      scale: 0.1
      prob: 0.5
    uncond_prob: 0.1
    guidance_scale: 1.0
    hidden_dim: 256
    nhead: 8
    num_encoder_layers: 1
    num_decoder_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    activation: "relu"
    normalize_before: false
    return_intermediate_dec: true
    pos_embed_type: "learned"
    instrides: [32]

CRITERION:
  - name: "FeatureMSELoss"
    type: "models.cfgcad.criterion.FeatureMSELoss"
    kwargs:
      weight: 1.0
  - name: "SVDLoss"
    type: "models.cfgcad.criterion.SVDLoss"
    kwargs: {}

# Dataset configuration
DATASET:
  name: "mvtecad"
  root: "./data/mvtecad"
  classes: ["bottle", "cable", "capsule", "carpet", "grid", "leather", "metal_nut", "pill", "screw", "tile", "toothbrush", "transistor", "wood", "zipper"]
  batch_size: 8
  num_workers: 4
  image_size: 256 